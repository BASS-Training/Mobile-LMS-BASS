name: lms_mobile_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  youtube_player_flutter: ^9.1.3
  go_router: ^13.0.0
  dio: ^5.3.0
  alice: ^1.0.0
  alice_dio: ^1.0.7
  get_it: ^8.2.0
  freezed_annotation: ^3.1.0
  logger: ^2.6.1
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/bass_logo.png
  color_dark: "#ffffff"
  android: true
  ios: true
  android_gravity: center

  android_12:
    color: "#ffffff"
    image: assets/images/bass_logo.png
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#ffffff"