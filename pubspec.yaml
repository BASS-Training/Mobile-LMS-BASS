name: lms_mobile_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  get_it: ^8.0.3
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  formz: ^0.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  youtube_player_flutter: ^9.1.3
  go_router: ^13.0.0
  dio: ^5.3.0
  dartz: ^0.10.1
  syncfusion_flutter_pdfviewer: ^28.2.7
  url_launcher: ^6.3.0
  flutter_html: ^3.0.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/bass_logo.png
  color_dark: "#ffffff"
  android: true
  ios: true
  android_gravity: center

  android_12:
    color: "#ffffff"
    image: assets/images/bass_logo.png
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#ffffff"

# App launcher icon generated from assets/launcher/* via flutter_launcher_icons.
# Regenerate after changing the source images: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/icon_master.png"
  # Android adaptive icon (API 26+): logo on a white background.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  min_sdk_android: 21
  # iOS rejects icons with transparency — flatten onto white.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"